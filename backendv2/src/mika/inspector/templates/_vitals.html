{% for v in vitals %}<a class="vital{{ ' optional' if v.optional }}"{% if v.href %} href="{{ v.href }}"{% endif %}{% if v.hint %} title="{{ v.hint }}"{% endif %}>{% if v.swatch %}<span class="swatch sw-{{ v.swatch }}"></span>{% elif v.dot %}<span class="dot {{ v.dot }}"></span>{% endif %}<span class="vital-label">{{ v.label }}</span> <b>{{ v.text }}</b>{% if v.ratio is defined and v.ratio is not none %} <meter class="vital-meter" min="0" max="1" value="{{ v.ratio }}">{{ (v.ratio * 100)|round|int }} %</meter>{% endif %}</a>{% endfor %}
