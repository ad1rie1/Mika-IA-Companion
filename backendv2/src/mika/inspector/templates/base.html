<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — inspecteur</title>
<style>
:root{--bg:#fbfaf8;--panel:#fff;--fg:#1d1c1a;--mut:#6b6760;--line:#e4e0da;--acc:#6d44c4;--ok:#1f7a44;--ko:#b3261e;--warn:#9a6700}
@media (prefers-color-scheme: dark){:root{--bg:#161514;--panel:#1d1c1a;--fg:#ecebe8;--mut:#a29d95;--line:#302d2a;--acc:#b595f5;--ok:#6fcf97;--ko:#f28b82;--warn:#e3b341}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;margin:0}
header{border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;align-items:baseline}
header .brand{font-weight:700;color:var(--acc);margin-right:.4rem}
header .group{display:flex;flex-wrap:wrap;gap:.2rem .8rem;align-items:baseline}
header .group b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
header a{color:var(--fg);text-decoration:none}header a.on{color:var(--acc);font-weight:600}
main{padding:1rem;max-width:1240px;margin:auto}
h1{font-size:1.35rem;margin:.2rem 0 .8rem}h2{font-size:1.05rem;margin:1.6rem 0 .5rem}h3{font-size:.98rem;margin:1rem 0 .4rem}
a{color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;white-space:nowrap}
code,pre{font:12.5px/1.45 ui-monospace,monospace}pre{white-space:pre-wrap;word-break:break-word;margin:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.ko{color:var(--ko)}.degraded,.warn{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}
dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:.25rem 1rem;margin:0}dt{color:var(--mut)}dd{margin:0}
input,select,textarea{font:inherit;padding:.3rem .45rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
textarea{width:100%;min-height:18rem;font:12.5px/1.45 ui-monospace,monospace}
button{font:inherit;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.quiet{background:transparent;color:var(--acc)}
form.inline{display:inline}
.pill{display:inline-block;padding:0 .45rem;border-radius:99px;border:1px solid var(--line);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
label.slider{display:grid;grid-template-columns:10rem 1fr 3rem;gap:.6rem;align-items:center;margin:.3rem 0}
@media (max-width:640px){td,th{padding:.3rem}.hide-sm{display:none}dl{grid-template-columns:1fr}label.slider{grid-template-columns:1fr 3rem}}
</style></head><body>
<header><span class="brand">Mika</span>
{% for group, items in menu %}<span class="group"><b>{{ group }}</b>{% for path, label in items %}<a href="{{ PREFIX }}{{ path }}" class="{{ 'on' if here == path or (path != '/' and here.startswith(path)) else '' }}">{{ label }}</a>{% endfor %}</span>{% endfor %}
</header>
<main><h1>{{ title }}</h1>
{% for m in messages or [] %}<p class="{{ m[0] }}">{{ m[1] }}</p>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
