<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#chat" aria-label="Mika, accueil">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Mika</span>
    </a>
    <!-- Sur un téléphone, comme dans l'app Android : son visage dans la barre plutôt qu'un coin qui flotte. -->
    <button class="brand-face" id="brand-face" type="button" title="Ce qu'elle fait"></button>
    <nav class="nav" id="nav" aria-label="Rubriques">
      <a href="#chat" data-nav="chat" title="Chat" aria-label="Chat"><svg class="ico"><use href="#i-chat"/></svg><span>Chat</span></a>
      <a href="#outils" data-nav="outils" title="Outils" aria-label="Outils"><svg class="ico"><use href="#i-tools"/></svg><span>Outils</span></a>
      <a href="#mail" data-nav="mail" title="Mail" aria-label="Mail"><svg class="ico"><use href="#i-mail"/></svg><span>Mail</span><b class="badge" data-count="mail"></b></a>
      <a href="#teams" data-nav="teams" title="Teams" aria-label="Teams"><svg class="ico"><use href="#i-teams"/></svg><span>Teams</span><b class="badge" data-count="teams"></b></a>
      <a href="#telephone" data-nav="telephone" title="Téléphone" aria-label="Téléphone"><svg class="ico"><use href="#i-phone"/></svg><span>Téléphone</span><b class="badge" data-count="telephone"></b></a>
      <a href="#parametres" data-nav="parametres" title="Paramètres" aria-label="Paramètres"><svg class="ico"><use href="#i-settings"/></svg><span>Paramètres</span></a>
    </nav>
    <div class="top-right">
      <button class="gsearch" id="gsearch" type="button" title="Rechercher partout (Ctrl K)" aria-label="Rechercher partout">
        <svg class="ico sm"><use href="#i-search"/></svg><span>Rechercher partout</span><kbd class="kbd">Ctrl K</kbd>
      </button>
      <!-- Mika, en haut à droite sur tous les écrans : son visage (sa VRM servie en HTTP, sinon son portrait pré-rendu),
           sur l'aura de son humeur, son nom et sa ligne d'état, comme la barre du haut de l'app Android. -->
      <button class="state-pill" id="state-pill" type="button" aria-haspopup="dialog" title="Ce qu'elle fait">
        <span class="sp-face">
          <span class="mika-corner" id="mika-corner" data-size="mini">
            <span class="mc-stage" id="mc-stage">
              <span class="mc-glow" aria-hidden="true"></span>
