<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mika</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='.1' stop-color='%234f46e5'/%3E%3Cstop offset='.95' stop-color='%23db3f76'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<script>
  /* Le thème avant le premier rendu : ?theme=dark|light (pour les captures, sans le retenir), sinon le choix
     retenu, sinon le système. La même clé que src/shell/theme.ts. */
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    var t = q;
    if (t !== 'dark' && t !== 'light' && t !== 'system') {
      try { t = localStorage.getItem('mika-theme'); } catch (e) { t = null; }
    }
    if (t !== 'dark' && t !== 'light' && t !== 'system') t = 'system';
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themeChoice = t;
  })();
</script>
</head>
<body>
<div class="login" id="login" hidden></div>
<div class="app" id="app" hidden></div>

<!-- Ce qui flotte au-dessus des écrans : la carte « Ce qu'elle fait », la palette Ctrl K, les fenêtres, les toasts. -->
<div class="popover state-card" id="state-card" role="dialog" aria-label="Ce qu'elle fait" hidden></div>
<div class="palette-scrim" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Rechercher partout">
    <div class="palette-input">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="palette-q" type="search" placeholder="Un écran, un réglage, un message, un fil de travail…" autocomplete="off" aria-label="Rechercher partout">
      <kbd class="kbd">Échap</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>
<div class="modal-root" id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
