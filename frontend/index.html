<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VTuber Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }

      /* Chat overlay */
      #chat-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 40%;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.2) transparent;
      }
      .chat-bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        animation: fadeIn 0.3s ease;
      }
      .chat-bubble.vtuber {
        align-self: flex-start;
        background: rgba(99, 102, 241, 0.85);
        color: white;
        border-bottom-left-radius: 4px;
        backdrop-filter: blur(8px);
      }
      .chat-bubble.user {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border-bottom-right-radius: 4px;
        backdrop-filter: blur(8px);
      }
      #chat-input-container {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      #chat-input {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        font-size: 14px;
        outline: none;
        backdrop-filter: blur(12px);
      }
      #chat-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      #chat-send {
        padding: 12px 20px;
        border: none;
        border-radius: 24px;
        background: rgba(99, 102, 241, 0.85);
        color: white;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: background 0.2s;
      }
      #chat-send:hover {
        background: rgba(99, 102, 241, 1);
      }
      #chat-attach {
        padding: 12px 14px;
        border: none;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255,255,255,0.7);
        font-size: 16px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: background 0.2s;
        flex-shrink: 0;
      }
      #chat-attach:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      #attachment-previews {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 16px 6px;
        pointer-events: auto;
      }
      .attachment-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 6px;
        border-radius: 12px;
        background: rgba(255,255,255,0.12);
        font-size: 12px;
        color: white;
        backdrop-filter: blur(8px);
        max-width: 160px;
      }
      .attachment-chip img {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .attachment-chip .chip-icon {
        font-size: 18px;
        flex-shrink: 0;
      }
      .attachment-chip .chip-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .attachment-chip .chip-remove {
        cursor: pointer;
        opacity: 0.6;
        flex-shrink: 0;
        padding: 0 2px;
      }
      .attachment-chip .chip-remove:hover {
        opacity: 1;
      }
      #chat-container.drag-over::after {
        content: "Déposer ici";
        position: absolute;
        inset: 0;
        background: rgba(99,102,241,0.35);
        border: 2px dashed rgba(99,102,241,0.8);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        pointer-events: none;
      }

      /* Emotion indicator */
      #emotion-display {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 8px 16px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
        font-size: 13px;
        backdrop-filter: blur(8px);
        transition: all 0.3s ease;
      }

      /* Connection status */
      #connection-status {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        backdrop-filter: blur(8px);
      }
      #connection-status.connected {
        background: rgba(34, 197, 94, 0.3);
        color: #86efac;
      }
      #connection-status.disconnected {
        background: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Identity bar (top, centered) */
      #identity-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border-radius: 14px;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(8px);
        font-size: 12px;
        color: rgba(255,255,255,0.9);
        pointer-events: auto;
      }
      #identity-name {
        background: transparent;
        border: none;
        color: white;
        font-size: 12px;
        border-bottom: 1px dashed rgba(255,255,255,0.3);
        width: 140px;
        outline: none;
      }
      #identity-name::placeholder { color: rgba(255,255,255,0.45); }
      #identity-reset {
        background: rgba(239,68,68,0.25);
        border: none;
        color: #fca5a5;
        border-radius: 8px;
        padding: 3px 8px;
        cursor: pointer;
        font-size: 11px;
      }
      #identity-reset:hover { background: rgba(239,68,68,0.45); color: white; }

      /* Inner life panel (right side, below emotion indicator) */
      #inner-life-panel {
        position: absolute;
        top: 60px;
        right: 16px;
        width: 320px;
        max-height: calc(100% - 80px);
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(10px);
        color: white;
        font-size: 13px;
        overflow: hidden;
        pointer-events: auto;
      }
      .il-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
        background: rgba(99,102,241,0.3);
        font-size: 13px;
        letter-spacing: 0.5px;
        user-select: none;
      }
      .il-header > span:first-child { flex: 1; }
      .il-header:hover { background: rgba(99,102,241,0.45); }
      .il-toggle { font-size: 12px; opacity: 0.8; }
      .il-phase-badge {
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0;
        background: rgba(99,102,241,0.2);
        color: #c7d2fe;
        white-space: nowrap;
      }
      .il-sleep-badge {
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
        background: rgba(139, 92, 246, 0.25);
        color: #ddd6fe;
        white-space: nowrap;
      }
      .il-sleep-badge[hidden] { display: none; }

      /* Dream section */
      .il-dream-meta, .il-journal-meta {
        display: flex;
        gap: 8px;
        font-size: 11px;
        opacity: 0.8;
        margin-bottom: 4px;
        flex-wrap: wrap;
      }
      .il-dream-type { font-weight: 600; }
      .il-dream-emotion, .il-journal-emotion {
        background: rgba(255,255,255,0.08);
        padding: 1px 6px;
        border-radius: 6px;
      }
      .il-dream-vividness {
        opacity: 0.6;
      }
      .il-dream-recalled {
        color: #34d399;
        opacity: 0.8;
      }
      .il-dream-text, .il-journal-text {
        font-size: 13px;
        line-height: 1.45;
        font-style: italic;
        margin: 0;
        padding: 6px 8px;
        border-left: 2px solid rgba(167, 139, 250, 0.5);
        background: rgba(139, 92, 246, 0.08);
        border-radius: 0 4px 4px 0;
      }
      .il-journal-text {
        font-style: normal;
        border-left-color: rgba(251, 191, 36, 0.5);
        background: rgba(251, 191, 36, 0.06);
      }
      .il-journal-persons {
        opacity: 0.7;
      }

      /* Projects */
      .il-project {
        padding: 6px 8px;
        margin-bottom: 6px;
        background: rgba(255,255,255,0.04);
        border-left: 2px solid rgba(99,102,241,0.6);
        border-radius: 4px;
      }
      .il-project:last-child { margin-bottom: 0; }
      .il-project-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .il-project-prio { opacity: 0.8; }
      .il-project-title { font-weight: 500; flex: 1; }
      .il-project-ep {
        background: rgba(139,92,246,0.25);
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 10px;
        text-transform: uppercase;
      }
      .il-project-blocked {
        color: #ef4444;
        font-size: 11px;
      }
      .il-project-bar-wrap {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
      }
      .il-project-bar {
        flex: 1;
        position: relative;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .il-project-fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: #10b981;
        border-radius: 3px;
        transition: width 0.6s ease;
      }
      .il-project-pct {
        font-size: 11px;
        opacity: 0.7;
        min-width: 36px;
        text-align: right;
      }
      .il-project-sched {
        font-size: 11px;
        opacity: 0.6;
        font-style: italic;
      }

      /* Pending approvals */
      #il-pending-actions { background: rgba(239,68,68,0.08); }
      #il-pending-actions h4 { color: #fbbf24; }
      .il-pending {
        padding: 8px;
        margin-bottom: 6px;
        background: rgba(251,191,36,0.08);
        border: 1px solid rgba(251,191,36,0.25);
        border-radius: 4px;
      }
      .il-pending-project {
        font-size: 11px;
        font-weight: 500;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .il-pending-kind {
        background: rgba(99,102,241,0.2);
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 10px;
        color: #c7d2fe;
        text-transform: uppercase;
      }
      .il-pending-proposal {
        font-size: 13px;
        margin-bottom: 6px;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .il-pending-actions {
        display: flex;
        gap: 6px;
      }
      .il-btn {
        flex: 1;
        padding: 4px 10px;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.2s;
      }
      .il-btn:disabled { opacity: 0.5; cursor: default; }
      .il-btn-approve {
        background: #10b981;
        color: white;
      }
      .il-btn-reject {
        background: rgba(239,68,68,0.8);
        color: white;
      }

      .il-energy-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .il-energy-bar {
        flex: 1;
        position: relative;
        height: 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .il-energy-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 4px;
        transition: width 0.6s ease, background 0.6s ease;
      }
      .il-energy-value {
        font-size: 11px;
        opacity: 0.75;
        min-width: 32px;
        text-align: right;
      }
      .il-body {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.2) transparent;
      }
      .il-section {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .il-section:last-child { border-bottom: none; }
      .il-section h4 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255,255,255,0.6);
        margin-bottom: 6px;
        font-weight: 500;
      }
      .il-blend-body { font-size: 14px; }
      .il-emotion-primary { font-weight: 600; }
      .il-emotion-secondary { font-weight: 500; opacity: 0.85; }
      .il-ambivalence { opacity: 0.5; font-style: italic; }
      .il-weight { opacity: 0.6; font-size: 12px; }

      .il-drive {
        display: grid;
        grid-template-columns: 22px 1fr 90px 36px;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .il-drive-icon { font-size: 14px; text-align: center; }
      .il-drive-label { opacity: 0.85; }
      .il-drive-bar {
        position: relative;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .il-drive-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        transition: width 0.4s ease;
      }
      .il-drive-pct { text-align: right; opacity: 0.6; font-size: 11px; }

      .il-narrative-body {
        font-style: italic;
        line-height: 1.5;
        opacity: 0.9;
        font-size: 12px;
      }

      .il-ruminations-body {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .il-ruminations-body li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .il-rumination-intensity {
        flex-shrink: 0;
        font-size: 10px;
        width: 34px;
        padding: 2px 4px;
        border-radius: 6px;
        background: rgba(245,158,11,0.25);
        color: #fcd34d;
        text-align: center;
      }
      .il-rumination-text { opacity: 0.85; line-height: 1.4; }

      .il-profile-summary {
        font-style: italic;
        font-size: 12px;
        opacity: 0.9;
        margin-bottom: 6px;
        line-height: 1.4;
      }
      .il-profile-tags {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 11px;
      }
      .il-profile-tags li {
        padding: 2px 0;
        opacity: 0.8;
      }
      .il-profile-tags strong { color: #a5b4fc; font-weight: 600; }
      .il-commitment-head {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(252,165,165,0.8);
        margin: 8px 0 4px;
      }
      .il-commitments {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 12px;
      }
      .il-commitments li {
        padding: 3px 8px;
        margin-bottom: 3px;
        background: rgba(239,68,68,0.1);
        border-left: 2px solid #fca5a5;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="connection-status" class="disconnected">Disconnected</div>
      <div id="emotion-display">neutral</div>
      <div id="identity-bar">
        <span>Tu es</span>
        <input id="identity-name" type="text" placeholder="ton prénom" autocomplete="off" />
        <button id="identity-reset" title="Réinitialiser l'identité">reset</button>
      </div>
      <div id="inner-life-panel"></div>
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="attachment-previews"></div>
        <div id="chat-input-container">
          <button id="chat-attach" title="Joindre un fichier">📎</button>
          <input id="chat-input" type="text" placeholder="Envoie un message..." autocomplete="off" />
          <button id="chat-send">Envoyer</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
