<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VTuber Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }

      /* Chat overlay */
      #chat-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 40%;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.2) transparent;
      }
      .chat-bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        animation: fadeIn 0.3s ease;
      }
      .chat-bubble.vtuber {
        align-self: flex-start;
        background: rgba(99, 102, 241, 0.85);
        color: white;
        border-bottom-left-radius: 4px;
        backdrop-filter: blur(8px);
      }
      .chat-bubble.user {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border-bottom-right-radius: 4px;
        backdrop-filter: blur(8px);
      }
      #chat-input-container {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      #chat-input {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        font-size: 14px;
        outline: none;
        backdrop-filter: blur(12px);
      }
      #chat-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      #chat-send {
        padding: 12px 20px;
        border: none;
        border-radius: 24px;
        background: rgba(99, 102, 241, 0.85);
        color: white;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: background 0.2s;
      }
      #chat-send:hover {
        background: rgba(99, 102, 241, 1);
      }

      /* Emotion indicator */
      #emotion-display {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 8px 16px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
        font-size: 13px;
        backdrop-filter: blur(8px);
        transition: all 0.3s ease;
      }

      /* Connection status */
      #connection-status {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        backdrop-filter: blur(8px);
      }
      #connection-status.connected {
        background: rgba(34, 197, 94, 0.3);
        color: #86efac;
      }
      #connection-status.disconnected {
        background: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="connection-status" class="disconnected">Disconnected</div>
      <div id="emotion-display">neutral</div>
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
          <input id="chat-input" type="text" placeholder="Envoie un message..." autocomplete="off" />
          <button id="chat-send">Envoyer</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
