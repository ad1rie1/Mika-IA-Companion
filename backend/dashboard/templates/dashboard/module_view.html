{% extends "dashboard/base.html" %}
{% load static %}
{% block scripts %}
  <script>
    window.ModuleView = {
      module: "{{ module_name }}",
      key: "{{ view_key }}",
      label: "{{ view_label|escapejs }}",
      dataUrl: "/dashboard/api/modules/{{ module_name }}/views/{{ view_key }}",
      itemUrl: (id) =>
        `/dashboard/api/modules/{{ module_name }}/views/{{ view_key }}/items/${encodeURIComponent(id)}`,
      actionUrl: (key) =>
        `/dashboard/api/modules/{{ module_name }}/views/{{ view_key }}/actions/${encodeURIComponent(key)}`,
      hasDetail: {% if view_has_detail %}true{% else %}false{% endif %},
      idField: "{{ view_id_field|default:'id'|escapejs }}",
      actions: [
        {% for a in view_actions %}
        { key: "{{ a.key|escapejs }}", label: "{{ a.label|escapejs }}",
          method: "{{ a.method }}", confirm: {% if a.confirm %}"{{ a.confirm|escapejs }}"{% else %}null{% endif %} }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ],
    };
  </script>
  {% if view_js %}
    <script src="{{ view_js }}"></script>
  {% else %}
    <script src="{% static 'dashboard/js/views/module_default.js' %}"></script>
  {% endif %}
{% endblock %}
