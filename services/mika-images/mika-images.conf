# Réglages du serveur d'images local (lus par serve.sh et install.sh ; une variable déjà dans l'environnement gagne).

# Où tout vit : binaire, poids, journaux. Jamais le disque système (il est plein).
MIKA_IMAGES_HOME="${MIKA_IMAGES_HOME:-/mnt/games/mika-images}"

# stable-diffusion.cpp, version épinglée (construction Vulkan pour Linux : aucune compilation, ni CUDA ni torch)
SD_RELEASE="${SD_RELEASE:-master-929-3f8527a}"
SD_ASSET="${SD_ASSET:-sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip}"
SD_SHA256="${SD_SHA256:-e35cc73cf5ba9637d1dc1d717760e7b8428376a4905d57e72ec8c871864f62c7}"

# Les poids (vérifiés par models.sha256, qui connaît aussi les variantes Q4_K_M, plus légères et plus rapides)
# En Q8_0 : plus fidèles, ≈ 16 Go à télécharger ; le modèle de diffusion tient en VRAM, l'encodeur reste en RAM.
DIFFUSION_REPO="${DIFFUSION_REPO:-abenzerps/Qwen-Image-2.1-Uncensored-GGUF}"
DIFFUSION_FILE="${DIFFUSION_FILE:-qwen-image-2.1-UC-Q8_0.gguf}"
VAE_REPO="${VAE_REPO:-abenzerps/Qwen-Image-2.1-Uncensored-GGUF}"
VAE_FILE="${VAE_FILE:-vae/qwen_image_2.1_vae_bf16.safetensors}"
LLM_REPO="${LLM_REPO:-Qwen/Qwen3-VL-8B-Instruct-GGUF}"
LLM_FILE="${LLM_FILE:-Qwen3VL-8B-Instruct-Q8_0.gguf}"
# le projecteur de vision : sert à retoucher une image (plus tard)
VISION_FILE="${VISION_FILE:-mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf}"

# Le serveur : sd-server écoute ici, derrière le relais (systemd) qui, lui, écoute sur PUBLIC_PORT
SD_PORT="${SD_PORT:-8191}"
PUBLIC_PORT="${PUBLIC_PORT:-8190}"
# arrêté après tant d'inactivité (RAM et VRAM rendues) ; redémarré à la demande suivante
IDLE_STOP="${IDLE_STOP:-10min}"

# La génération par défaut (une requête OpenAI ne dit que le prompt et la taille)
# L'ordonnanceur « simple » et 25 pas : avec celui que stable-diffusion.cpp choisit pour Qwen-Image 2.1, l'image
# porte une grille fine (8 px, et des bandes de 128 px) — un défaut connu (issue sd.cpp #2041). Mesuré à 1024² :
# score de grille 10,3 → 1,5 ; à 20 pas, il en reste (3,0).
STEPS="${STEPS:-40}"
CFG="${CFG:-6.0}"
SAMPLER="${SAMPLER:-euler}"
SCHEDULER="${SCHEDULER:-simple}"
# un cache de pas : easycache divise le temps par deux à 1024² pour une image presque identique (mesuré : 116 s au
# lieu de 245 s sur une RTX 3060), mais peut laisser une texture fine ; vide : aucun (le choix par défaut, qualité)
CACHE_MODE="${CACHE_MODE:-}"
# le GPU : choisi par son nom parmi les périphériques Vulkan de ggml (le GPU intégré en est un aussi, et l'ordre de
# ggml n'est pas celui de vulkaninfo) ; GGML_VK_VISIBLE_DEVICES, s'il est donné, l'emporte
GPU_MATCH="${GPU_MATCH:-NVIDIA}"
GGML_VK_VISIBLE_DEVICES="${GGML_VK_VISIBLE_DEVICES:-}"
# options en plus pour sd-server (exemple : --max-vram 10 ou --offload-to-cpu)
SD_EXTRA="${SD_EXTRA:-}"
